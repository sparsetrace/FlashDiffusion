[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdiffusion"
version = "0.1.3.dev0"
description = "FlashDiffusion demo with matrix-free SM80/JAX xgemm primitives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Julio Candanedo"}]
keywords = ["diffusion maps", "kernel operators", "CUDA", "JAX", "matrix-free"]
dependencies = ["jax>=0.4.31", "jaxlib>=0.4.31", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/sparsetrace/FlashDiffusion"

[tool.setuptools]
packages = ["flashdiffusion", "xgemm"]
include-package-data = true

[tool.setuptools.package-data]
xgemm = ["csrc/sm80/*.cu", "csrc/sm80/*.cuh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
