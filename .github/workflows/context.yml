# .github/workflows/context.yml
name: CONTEXT

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate context.md and context.json
        run: python context/context.py

      - name: Commit updated context files
        run: |
          git add context/context.md context/context.json
          if git diff --cached --quiet; then
            echo "Context already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate repository context"
          git push origin "HEAD:${GITHUB_REF_NAME}"
